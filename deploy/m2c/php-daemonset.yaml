apiVersion: v1
kind: ConfigMap
metadata:
  name: php-index
  namespace: default
data:
  index.php: |
    <?php
    header('Content-Type: text/plain');
    echo "Hostname: " . gethostname() . "\n";
    echo "PodIP: " . ($_SERVER['SERVER_ADDR'] ?? 'unknown') . "\n";
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: php-web
  namespace: default
  labels: { app: php-web }
spec:
  selector:
    matchLabels: { app: php-web }
  template:
    metadata:
      labels: { app: php-web }
    spec:
      # No control-plane toleration => the DaemonSet skips tainted node-1,
      # landing exactly one pod on each of the three workers.
      containers:
      - name: php
        # Minimal custom image (deploy/m2c/php-alpine.Dockerfile: alpine:3.21 +
        # apk php84, ~18MB). The official php:8.4-apache (~500MB Debian) and
        # php:8.4-cli-alpine both broke here: the big Debian pull filled the
        # worker's small disk and every subsequent containerd-rs layer unpack
        # failed with ENOSPC. This tiny image (image ENTRYPOINT runs
        # `php84 -S 0.0.0.0:80 -t /var/www/html`) keeps the workers well under
        # their disk budget.
        image: 10.88.0.1:5000/mikronetes-php:m2c
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: index
          mountPath: /var/www/html
      volumes:
      - name: index
        configMap:
          name: php-index
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: default
spec:
  type: ClusterIP
  selector: { app: php-web }
  ports:
  - name: http
    port: 80
    targetPort: 80
