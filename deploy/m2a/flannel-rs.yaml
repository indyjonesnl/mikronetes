apiVersion: v1
kind: Namespace
metadata:
  labels:
    k8s-app: flannel
    pod-security.kubernetes.io/enforce: privileged
  name: kube-flannel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: flannel
  name: flannel
  namespace: kube-flannel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: flannel
  name: flannel
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: flannel
  name: flannel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flannel
subjects:
- kind: ServiceAccount
  name: flannel
  namespace: kube-flannel
---
apiVersion: v1
data:
  cni-conf.json: |
    {
      "name": "cbr0",
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "flannel",
          "delegate": {
            "hairpinMode": true,
            "isDefaultGateway": true
          }
        },
        {
          "type": "portmap",
          "capabilities": {
            "portMappings": true
          }
        }
      ]
    }
  net-conf.json: |
    {
      "Network": "10.244.0.0/16",
      "EnableNFTables": false,
      "Backend": {
        "Type": "host-gw"
      }
    }
kind: ConfigMap
metadata:
  labels:
    app: flannel
    k8s-app: flannel
    tier: node
  name: kube-flannel-cfg
  namespace: kube-flannel
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-flannel-ds
  namespace: kube-flannel
  labels:
    app: flannel
    tier: node
spec:
  selector:
    matchLabels:
      app: flannel
  template:
    metadata:
      labels:
        app: flannel
        tier: node
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      serviceAccountName: flannel
      # M2a: no initContainers. The flannel CNI conflist is pre-placed in the
      # initramfs at /var/lib/cni/conf/10-flannel.conflist (containerd-rs
      # cni_conf_dir). The CNI plugin binaries are pre-placed at /var/lib/cni/bin.
      # containerd-rs may not create hostPath directories for this bootstrap path
      # (M3 work item), so the init-container approach cannot be used here.
      containers:
      - name: kube-flannel
        # M2b: use flannel-rs v0.1.3 with host-gw backend from local registry.
        # host-gw (not vxlan): the microVM guest kernel has no CONFIG_VXLAN, so
        # ensure_vxlan() fails with ENOTSUP and flanneld never writes subnet.env.
        # All nodes sit on one L2 bridge (mkn-br0), which is exactly host-gw's
        # requirement — peer pod CIDRs are reached via direct routes to node IPs.
        # 10.88.0.1:5000 is the host bridge registry; no NAT masquerade in VM
        # so ghcr.io is unreachable. containerd-rs treats it as HTTP via
        # /boot/certs.d/<registry>/hosts.toml.
        image: 10.88.0.1:5000/flannel-rs:v0.1.3
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RUST_LOG
          value: "debug"
        # M2a: kube-proxy is disabled; flannel must reach the api-server directly.
        # Use 127.0.0.1 (not 10.88.0.2) because rusternetes generates a self-signed
        # TLS cert with SANs ["localhost","127.0.0.1"] — the node IP 10.88.0.2 is
        # NOT in the SANs, so rustls rejects the connection. flannel runs with
        # hostNetwork=true so 127.0.0.1 is reachable. The kube crate's
        # Client::try_default() picks these up when building in-cluster config.
        # M2b: host-gw backend (no overlay device; direct routes on mkn-br0 L2).
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6443"
        # M2a: run flanneld directly so its stderr goes to the CRI log (captured
        # by containerd-rs from crun's piped stderr), which surfaces on the
        # serial console via the crun-stderr-debug hook in server.rs.
        # The bash-wrapper approach was masking the crash output because the
        # wrapper piped flanneld stderr into /dev/termination-log (not to crun
        # stdout/stderr), leaving the CRI log empty.
        command: ["/usr/local/bin/flanneld"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: run
          mountPath: /run/flannel
        - name: flannel-cfg
          mountPath: /etc/kube-flannel/
        # M2a: xtables-lock omitted. containerd-rs may not support
        # FileOrCreate hostPath volumes (M3 work item): it calls create_dir_all on
        # the missing source path, producing a directory; crun then fails to bind a
        # directory to the non-existent /run/xtables.lock file-destination in the
        # debian rootfs, causing exit code 1. iptables masq detection is best-effort
        # (warns on failure) so omitting the lock is safe for M2a single-node.
      volumes:
      - name: run
        hostPath:
          path: /run/flannel
          type: DirectoryOrCreate
      - name: flannel-cfg
        configMap:
          name: kube-flannel-cfg
